<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>muse — live music DSL</title>
  </head>
  <body>
    <header>
      <div class="logo">muse<span class="tag">β</span></div>
      <button id="run" class="primary" title="evaluate editor (ctrl+enter)">▶ run</button>
      <button id="play" title="resume playback">⏯ play</button>
      <button id="stop" title="stop (ctrl+.)">■ stop</button>
      <label class="bpm"
        >bpm <input id="bpm" type="number" value="120" min="30" max="300" step="1"
      /></label>
      <div id="pos" class="pos">—</div>
      <div id="audio-status" class="status">audio ○</div>
    </header>

    <nav class="tools" aria-label="editor tools">
      <label>example <select id="example"><option value="">select…</option><option value="default">demo</option><option value="drums">drums</option><option value="ambient">ambient</option><option value="pulse">pulse bass</option></select></label>
      <button id="restore" disabled>restore previous draft</button>
      <span id="draft-status" role="status">draft ready</span>
      <label>sample <input id="sample-name" value="my_sample" aria-label="sample name" maxlength="127" /></label>
      <label class="file-button">load audio<input id="sample-file" type="file" accept="audio/*" /></label>
      <label>seconds <input id="export-seconds" type="number" min="1" max="300" value="8" /></label>
      <button id="export">download WAV</button>
    </nav>
    <main>
      <section id="editor" aria-label="code editor"></section>
      <section id="bottom">
        <div id="console" aria-label="repl output"></div>
        <div id="viz-wrap"><canvas id="viz" aria-label="pattern visualizer"></canvas></div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
